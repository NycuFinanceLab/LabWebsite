<p class="Section">
 Find The Root In Head
</p>



<p class="Text">
 This simple program helps to play the trick &ldquo;find the root in head.&rdquo;<br />This can be done when <span><em>a</em><em>&lt;</em>1000</span> with exponent 2, <br />or <span><em>a</em><em>&lt;</em>100</span> with exponent 3, <br />or <span><em>a</em><em>&lt;</em>100</span> with exponent 41. 
</p>
