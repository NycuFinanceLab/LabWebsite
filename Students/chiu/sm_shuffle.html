<p class="Section">
 8 Perfect Faro Shuffles&nbsp;&nbsp;
</p>



<p class="Text">
 It&rsquo;s said that if a deck is perfectly shuffled eight times, the cards will be in the same order as they were before the shuffling.<br />Here is an experiment on it. 
</p>



<p class="Input">
 <img src="HTMLFiles/sm_shuffle_1.gif" alt="sm_shuffle_1.gif" width="599" height="161" style="vertical-align:middle" />
</p>

</p>

<p class="Output">
 <img src="HTMLFiles/sm_shuffle_3.gif" alt="sm_shuffle_3.gif" width="454" height="54" style="vertical-align:middle" />
</p>
