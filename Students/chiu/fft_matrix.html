<p class="Section">
 Demonstrate How FFT Works In Matrix Form
</p>



<p class="Text">
 The discrete Fourier transform of a vector <span><em>v</em></span> is equivalent to <span><span><img src="HTMLFiles/fft_matrix_1.gif" alt="fft_matrix_1.gif" width="51" height="38" style="vertical-align:middle" /></span></span>, where <span><em>F</em></span> is the matrix defined as follows:
</p>



<p class="Input">
 <img src="HTMLFiles/fft_matrix_2.gif" alt="fft_matrix_2.gif" width="318" height="92" style="vertical-align:middle" />
</p>

<p class="Output">
 <img src="HTMLFiles/fft_matrix_3.gif" alt="fft_matrix_3.gif" width="274" height="165" style="vertical-align:middle" />
</p>

<p class="Input">
 <img src="HTMLFiles/fft_matrix_4.gif" alt="fft_matrix_4.gif" width="212" height="105" style="vertical-align:middle" />
</p>

<p class="Output">
 <img src="HTMLFiles/fft_matrix_5.gif" alt="fft_matrix_5.gif" width="147" height="15" style="vertical-align:middle" />
</p>

<p class="Text">
 <span><em>F</em></span> can be decomposed into <span><span>log n+1</span></span> sparse matrics. &#8232;That&rsquo;s why FFT can be done in <span><span>O(n log n)</span></span> computational time. 
</p>



<p class="Input">
 <img src="HTMLFiles/fft_matrix_6.gif" alt="fft_matrix_6.gif" width="441" height="415" style="vertical-align:middle" />
</p>

<p class="Output">
 <img src="HTMLFiles/fft_matrix_7.gif" alt="fft_matrix_7.gif" width="132" height="117" style="vertical-align:middle" />
</p>
